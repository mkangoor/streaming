# Data contract for the tax-document domain.
#
# Single source of truth for: Lakeflow table schemas + column comments, DLT expectations,
# Unity Catalog tags (applied by `tax-rag apply-governance`) and docs/data_dictionary.md
# (generated by scripts/gen_docs.py; CI fails if it is stale).
contract: tax_documents
version: 1
owner: tax-data-platform
description: >-
  Tax law and guidance corpus (statutes, regulations, rulings, guidance, FAQs) ingested
  from the upstream tax-document API, curated in Unity Catalog and chunked for retrieval.

defaults:
  tags:
    domain: tax
    data_classification: public
    contains_pii: "false"

tables:
  bronze_tax_documents:
    layer: bronze
    managed_by: pipeline
    explicit_schema: true
    description: >-
      Append-only raw API payloads exactly as received. Protected from full refresh so
      history beyond the API's retention window can always be replayed.
    columns:
      - {name: document_id, type: STRING, description: Upstream document identifier extracted from the payload (may be null for malformed records).}
      - {name: document_version, type: BIGINT, description: Upstream monotonically increasing version of the document.}
      - {name: updated_at, type: TIMESTAMP, description: Upstream last-modified timestamp (UTC); drives incremental polling.}
      - {name: payload, type: STRING, description: Raw JSON document as returned by the source., tags: {raw: "true"}}
      - {name: source_mode, type: STRING, description: "Ingestion path: api, files or kafka."}
      - {name: source_ref, type: STRING, description: "Lineage pointer: API polling window, file path or kafka topic/partition/offset."}
      - {name: fetched_at, type: TIMESTAMP, description: When the record was read from the source (UTC).}

  silver_tax_document_events:
    layer: silver
    managed_by: pipeline
    explicit_schema: true
    description: >-
      Every validated document version (append-only change log). Records failing a `drop`
      quality rule are routed to silver_tax_document_quarantine instead.
    columns:
      - {name: document_id, type: STRING, description: Stable upstream identifier of the tax document., tags: {key: primary}}
      - {name: document_version, type: BIGINT, description: Upstream version; higher wins.}
      - {name: title, type: STRING, description: Document title.}
      - {name: document_type, type: STRING, description: "Normalised type: statute, regulation, ruling, guidance, publication, form_instructions, faq, case_law, other."}
      - {name: jurisdiction, type: STRING, description: "ISO 3166 country or subdivision code, e.g. US, US-CA, DE-BY."}
      - {name: tax_type, type: STRING, description: "Normalised tax type: income, corporate, payroll, sales_use, vat_gst, property, excise, estate_gift, other."}
      - {name: tax_year, type: INT, description: Tax year the document applies to; null when not year-specific.}
      - {name: effective_date, type: DATE, description: Date the provision takes effect.}
      - {name: expiration_date, type: DATE, description: Date the provision stops applying; null when open-ended.}
      - {name: source_url, type: STRING, description: Canonical URL of the authoritative source.}
      - {name: language, type: STRING, description: BCP-47 language tag of the body.}
      - {name: body_text, type: STRING, description: Body converted to normalised plain text.}
      - {name: content_hash, type: STRING, description: SHA-256 of body_text; detects content changes across versions.}
      - {name: is_deleted, type: BOOLEAN, description: Tombstone flag; true removes the document downstream.}
      - {name: updated_at, type: TIMESTAMP, description: Upstream last-modified timestamp (UTC).}
      - {name: source_mode, type: STRING, description: "Ingestion path: api, files or kafka."}
      - {name: source_ref, type: STRING, description: Lineage pointer back to the bronze record source.}
      - {name: fetched_at, type: TIMESTAMP, description: When the record was read from the source (UTC).}
      - {name: processed_at, type: TIMESTAMP, description: When the silver transformation ran (UTC).}

  silver_tax_document_quarantine:
    layer: silver
    managed_by: pipeline
    explicit_schema: true
    description: Records that failed at least one `drop` quality rule, with the raw payload for triage.
    columns:
      - {name: document_id, type: STRING, description: Upstream identifier if present.}
      - {name: document_version, type: BIGINT, description: Upstream version if present.}
      - {name: updated_at, type: TIMESTAMP, description: Upstream last-modified timestamp if parseable.}
      - {name: failed_rules, type: ARRAY<STRING>, description: Names of the quality rules the record violated.}
      - {name: payload, type: STRING, description: Raw JSON payload from bronze., tags: {raw: "true"}}
      - {name: source_mode, type: STRING, description: "Ingestion path: api, files or kafka."}
      - {name: source_ref, type: STRING, description: Lineage pointer back to the bronze record source.}
      - {name: processed_at, type: TIMESTAMP, description: When the record was quarantined (UTC).}

  silver_tax_documents:
    layer: silver
    managed_by: pipeline
    explicit_schema: true
    description: >-
      Current state of every live document (SCD type 1, one row per document_id). Deleted
      documents are removed. This is the table analysts should query.
    # Same columns as silver_tax_document_events minus cdc.except_columns (enforced by tests).
    columns:
      - {name: document_id, type: STRING, description: Stable upstream identifier of the tax document., tags: {key: primary}}
      - {name: document_version, type: BIGINT, description: Latest applied upstream version.}
      - {name: title, type: STRING, description: Document title.}
      - {name: document_type, type: STRING, description: Normalised document type.}
      - {name: jurisdiction, type: STRING, description: ISO 3166 country or subdivision code.}
      - {name: tax_type, type: STRING, description: Normalised tax type.}
      - {name: tax_year, type: INT, description: Tax year the document applies to.}
      - {name: effective_date, type: DATE, description: Date the provision takes effect.}
      - {name: expiration_date, type: DATE, description: Date the provision stops applying.}
      - {name: source_url, type: STRING, description: Canonical URL of the authoritative source.}
      - {name: language, type: STRING, description: BCP-47 language tag of the body.}
      - {name: body_text, type: STRING, description: Body converted to normalised plain text.}
      - {name: content_hash, type: STRING, description: SHA-256 of body_text.}
      - {name: updated_at, type: TIMESTAMP, description: Upstream last-modified timestamp (UTC).}
      - {name: source_mode, type: STRING, description: Ingestion path of the latest version.}

  silver_tax_documents_history:
    layer: silver
    managed_by: pipeline
    explicit_schema: false
    description: >-
      Full version history (SCD type 2). Use `__START_AT` / `__END_AT` to answer "what did the
      rule say on date X" audits.
    columns:
      - {name: document_id, type: STRING, description: Stable upstream identifier of the tax document.}
      - {name: document_version, type: BIGINT, description: Upstream version of this row.}
      - {name: __START_AT, type: "STRUCT<document_version: BIGINT, updated_at: TIMESTAMP>", description: Sequence value at which this version became current.}
      - {name: __END_AT, type: "STRUCT<document_version: BIGINT, updated_at: TIMESTAMP>", description: Sequence value at which this version was superseded; null if current.}

  gold_tax_document_chunks:
    layer: gold
    managed_by: job
    explicit_schema: true
    description: >-
      Retrieval-ready chunks of live documents (one row per chunk). Source of the Delta Sync
      vector search index; Change Data Feed is enabled.
    table_properties:
      delta.enableChangeDataFeed: "true"
    cluster_by: [document_id]
    columns:
      - {name: chunk_id, type: STRING, description: "Primary key: <document_id>::<chunk_index>.", tags: {key: primary, vector_search: primary_key}}
      - {name: document_id, type: STRING, description: Parent document identifier.}
      - {name: document_version, type: BIGINT, description: Document version the chunk was built from.}
      - {name: chunk_index, type: INT, description: Zero-based position of the chunk within the document.}
      - {name: chunk_text, type: STRING, description: Metadata header plus chunk body; the embedding source column., tags: {vector_search: embedding_source}}
      - {name: chunk_hash, type: STRING, description: SHA-256 of chunk_text.}
      - {name: title, type: STRING, description: Parent document title.}
      - {name: document_type, type: STRING, description: Normalised document type.}
      - {name: jurisdiction, type: STRING, description: ISO 3166 country or subdivision code.}
      - {name: tax_type, type: STRING, description: Normalised tax type.}
      - {name: tax_year, type: INT, description: Tax year the document applies to.}
      - {name: effective_date, type: STRING, description: ISO-8601 date the provision takes effect (string for vector search filtering).}
      - {name: expiration_date, type: STRING, description: ISO-8601 date the provision stops applying.}
      - {name: source_url, type: STRING, description: Canonical URL cited back to users.}
      - {name: language, type: STRING, description: BCP-47 language tag.}
      - {name: updated_at, type: TIMESTAMP, description: Upstream last-modified timestamp of the parent version.}
      - {name: synced_at, type: TIMESTAMP, description: When the chunk was written (UTC).}

# Expectations applied to silver_tax_document_events.
# drop -> row goes to quarantine; warn -> recorded in pipeline metrics only; fail -> stop the update.
quality_rules:
  - name: valid_document_id
    constraint: "document_id IS NOT NULL AND length(trim(document_id)) > 0"
    action: drop
    description: Every record must carry an upstream identifier.
  - name: valid_document_version
    constraint: "document_version IS NOT NULL AND document_version >= 0"
    action: drop
    description: Versions order updates; without one we cannot apply CDC safely.
  - name: valid_updated_at
    constraint: "updated_at IS NOT NULL"
    action: drop
    description: Required for incremental polling and CDC sequencing.
  - name: valid_jurisdiction
    constraint: "is_deleted OR jurisdiction IS NOT NULL"
    action: drop
    description: Answers are jurisdiction-specific; an unknown jurisdiction is unusable.
  - name: has_body
    constraint: "is_deleted OR (body_text IS NOT NULL AND length(body_text) > 0)"
    action: drop
    description: Live documents must have content to index.
  - name: valid_effective_window
    constraint: "expiration_date IS NULL OR effective_date IS NULL OR expiration_date >= effective_date"
    action: drop
    description: A provision cannot expire before it takes effect.
  - name: has_title
    constraint: "is_deleted OR (title IS NOT NULL AND length(trim(title)) > 0)"
    action: warn
    description: Titles drive citation quality; missing ones are tolerated but tracked.
  - name: has_source_url
    constraint: "is_deleted OR source_url IS NOT NULL"
    action: warn
    description: Answers should link to the authoritative source.

cdc:
  keys: [document_id]
  sequence_by: [document_version, updated_at]
  delete_condition: is_deleted
  except_columns: [is_deleted, source_ref, fetched_at, processed_at]
